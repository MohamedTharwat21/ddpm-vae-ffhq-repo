[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffhq-repo"
version = "0.1.0"
description = "Consolidated VAE / Latent-Diffusion / Pixel-DDPM research repository for FFHQ."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.26",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "torchmetrics[image]>=1.2",
    "lpips>=0.1.4",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.6", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
