# CONFIG dict for VAE v1 (MSE reconstruction loss,
# no perceptual loss, base_channels=32, no Sigmoid on decoder output).
# status: historical baseline - superseded by v2 (see configs/vae/v2.yaml).
experiment:
  name: vae_v1
  status: baseline
  description: >
    First FFHQ VAE run. MSE reconstruction loss only (no perceptual term).
    Kept for comparison against v2/v3 - see README.md's VAE comparison table.

data:
  global_seed: 42
  data_root: null                       # null = auto-detect under data_root_search
  data_root_search: /kaggle/input
  split_file: /kaggle/working/ffhq_split.json
  split_seed: 1234
  train_count: 60000
  val_count: 10000
  img_size: 64

model:
  type: vae
  latent_dim: 128
  base_channels: 32

perceptual_loss:
  enabled: false
  weight: 0.0
  vgg_model: vgg16
  vgg_pretrained: true
  vgg_layers: [3, 8, 15, 22]

training:
  batch_size: 128
  epochs: 40
  lr: 0.0002
  beta: 1.0
  beta_warmup_epochs: 10
  use_amp: true
  num_workers: 2
  resume: true

monitoring:
  num_generation_samples: 64
  num_recon_samples: 8

paths:
  output_dir: /kaggle/working/outputs_ffhq_vae/v1

evaluation:
  # source: supplied evaluation run for VAE v1
  reconstruction_samples: 10000
  generation_samples: 2048
  eval_batch_size: 64
